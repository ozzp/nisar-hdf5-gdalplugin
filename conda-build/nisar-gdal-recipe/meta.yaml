{% set name = "gdal-driver-nisar" %}
{% set version = "0.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  path: ../../frmts/nisar

build:
  number: 0
  skip: true  # [win]  # Don't have a bld.bat for Windows

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - sysroot_linux-64 2.17  # [linux64]
    - sysroot_linux-aarch64 2.17 # [linux_aarch64]
    - cmake
    - make

  host:
    # Key dependencies to link against (with minimum version floors)
    - gdal {{ gdal }}
    - libgdal-core {{ gdal }}
    - hdf5
    - zlib-ng      # Inject SIMD acceleration

  run:
    # Conda will dynamically read the exact versions used in 'host' 
    # and automatically pin the run dependencies to match.
    - {{ pin_compatible('gdal', max_pin='x.x') }}
    - {{ pin_compatible('libgdal-core', max_pin='x.x') }}
    - {{ pin_compatible('hdf5', max_pin='x.x') }}
    - zlib-ng

test:
  requirements:
    - gdal      # Provides the gdalinfo command-line tool
    - libgdal   # Metapackage that installs all standard driver plugins

  commands:
    - gdalinfo --formats | grep NISAR
    - test -f $PREFIX/share/doc/gdal-driver-nisar/README.md
    - test -f $PREFIX/share/doc/gdal-driver-nisar/HOWTO.md
    - test -f $PREFIX/share/doc/gdal-driver-nisar/SKILL.md
    - test -f $PREFIX/share/doc/gdal-driver-nisar/AGENT_GUIDE.md

about:
  home: https://github.com/JPL-Devin/nisar-hdf5-gdalplugin
  license: Apache-2.0
  license_file: ../../LICENSE
  summary: 'A GDAL plugin to read NISAR HDF5 files.'
  description: |
    A high-performance, read-only C++ GDAL plugin for NASA-ISRO NISAR HDF5 products
    (L1 RSLC/RIFG/RUNW, L2 GSLC/GCOV/GUNW/GOFF, L3 SME2): chunk-aligned block reads,
    coalesced range requests for S3/HTTPS access through GDAL VSI, georeferencing,
    validity masks, metadata-cube interpolation and an h5dump-style NISAR_DUMP domain.
    User documentation (README, HOWTO and the nisar-gdal skill) is installed to
    $CONDA_PREFIX/share/doc/gdal-driver-nisar/ and published at the doc_url below.
  doc_url: https://github.com/JPL-Devin/nisar-hdf5-gdalplugin/blob/main/docs/HOWTO.md
  dev_url: https://github.com/JPL-Devin/nisar-hdf5-gdalplugin

extra:
  recipe-maintainers:
    - ozzp
